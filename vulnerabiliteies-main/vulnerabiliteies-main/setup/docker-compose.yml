version: "3.9"

services:
  vulnlab:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    container_name: vulnlab
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLAG_RCE=FLAG{cmd_injection_rce}
    volumes:
      - vuln_db:/app/data
    networks:
      pentest_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  pentest_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  vuln_db:
